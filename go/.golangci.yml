# golangci-lint v2 config for vstar/go.
# https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - errorlint
    - goconst
    - misspell
  settings:
    misspell:
      locale: US
    goconst:
      min-len: 3
      min-occurrences: 3
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - goconst

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(hop.top/vstar)
    gofumpt:
      module-path: hop.top/vstar
      extra-rules: true
