[package]
name = "hop-top-vstar"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.98"
description = "V* calendar and contact interchange — Rust port of the Go reference implementation."
license = "MIT"
readme = "README.md"
homepage = "https://hop.top/vstar"
repository = "https://github.com/hop-top/vstar-rs"
keywords = ["vstar", "icalendar", "vcard", "rfc5545", "rfc6350"]
categories = ["date-and-time", "parser-implementations"]
exclude = ["/target"]

[lib]
name = "hop_top_vstar"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
unicode-normalization = "0.1"

# `default-features = false` drops the `clock` and `oldtime` features;
# V* resolves datetimes from the input, never from the host clock.
chrono = { version = "0.4", default-features = false, features = ["std"] }
