name: version-check

# Guards every release-version literal and every spec/vX.Y path against
# the release-please manifest (tools/version-check/check.py), and runs
# the guard's own unit tests. No path filter: literals live everywhere,
# and the run is a few seconds of standard-library Python.
#
# Release PRs stay green by construction: release-please bumps the
# manifest and the annotated extra-files together in one commit. A
# hand-edited literal, or a stale spec path, fails here on the pull
# request that introduces it -- before any release PR would carry it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    name: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard unit tests
        run: python3 -m unittest discover -s tools/version-check -v

      - name: Run version-check
        run: make version-check
