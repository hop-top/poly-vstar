name: version-check

# Guard over release-version literals and spec version paths: annotated
# literals equal the manifest, annotated files and `extra-files` are one
# set, no stray version literal, every `spec/vX.Y` path names a manifest
# version, and no language-tagged version-bearing PRODID default
# (`vstar-<lang> vX.Y.Z` -- PRODID is hashed, so the default is
# version-free and identical in every port). The rules and the script
# live in hop-top/.github. No path filter: literals live everywhere, and
# the run is a few seconds of standard-library Python.
#
# Release PRs stay green by construction: release-please bumps the
# manifest and the annotated extra-files together in one commit. A
# hand-edited literal, or a stale spec path, fails here on the pull
# request that introduces it -- before any release PR would carry it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: version-check
    uses: hop-top/.github/.github/workflows/version-check.yml@v0
    with:
      forbid-literal: |
        vstar-(go|ts|py|rs|php) v\d
