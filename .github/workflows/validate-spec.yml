name: validate (spec)

# Lints the specification prose. Path-filtered to spec/** so a Go-only
# change does not spin up Node. The spec-versioning gates (commit rules,
# status lines, the version-literal guard) are the org's shared
# workflows, called from their own files in this directory.

on:
  push:
    branches: [main]
    paths: ["spec/**", ".github/workflows/validate-spec.yml", "Makefile"]
  pull_request:
    branches: [main]
    paths: ["spec/**", ".github/workflows/validate-spec.yml", "Makefile"]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2@latest

      - name: Run markdownlint
        run: make lint-spec

