name: release-please-preflight

on:
  pull_request:
    paths:
      - '.github/release-please-config.json'
      - '.github/.release-please-manifest.json'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/release-please-preflight.yml'
      - 'go/go.mod'
      # Every port manifest release-please rewrites, so a change to one
      # is checked against the config and manifest before it merges.
      - 'ts/package.json'
      - 'py/pyproject.toml'
      - 'rs/Cargo.toml'
      - 'php/composer.json'
  workflow_dispatch: {}

jobs:
  preflight:
    permissions:
      contents: read
      pull-requests: write
    uses: hop-top/.github/.github/workflows/release-please-preflight.yml@v0
