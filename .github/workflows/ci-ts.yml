name: CI (TypeScript)

on:
  push:
    branches: [main]
    # spec/** is in the filter because spec/registry/ renders
    # ts/src/generated/; the Makefile because the gate runs through it.
    paths: ["ts/**", "spec/**", "Makefile", ".github/workflows/ci-ts.yml"]
  pull_request:
    branches: [main]
    paths: ["ts/**", "spec/**", "Makefile", ".github/workflows/ci-ts.yml"]

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in ts/package.json engines.node; 24 is
        # the next LTS line, so a breakage there is caught before it is
        # the floor.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      # package_json_file: the repo root has no package.json (this is a
      # polyglot monorepo); without it the action cannot find the
      # packageManager field and fails with "No pnpm version is specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml

      - name: Show toolchain
        run: |
          node --version
          pnpm --version

      - name: Lint
        run: make lint-ts

      - name: Test
        run: make test-ts

      - name: Build
        run: make build-ts
